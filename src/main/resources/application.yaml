logging:
  level:
    ROOT: INFO
    org.springframework: ERROR
    org.hibernate: ERROR
    com.kgisl.sbapp: INFO

  pattern:
    console: "- %msg%n"
    file: "*[%-5p]-- %m--%n"
  file: 
    name: logs/sbapp.log
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:~/sbapp
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true